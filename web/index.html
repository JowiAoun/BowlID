<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BowlID: your identity is in your swing</title>
    <meta name="description" content="No usernames. No passwords. Your account is how you bowl. A joke made for the Stupid Ideas Hackathon." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234a8ff0'/%3E%3Cpath d='M16 5c-2 0-3 1.6-3 3.4 0 1.5.8 2.4.8 3.6 0 1.6-2.3 4-2.3 8.2 0 3.6 1.7 6.8 4.5 6.8s4.500-3.200 4.500-6.800c0-4.200-2.300-6.600-2.300-8.200 0-1.200.8-2.100.8-3.600C19 6.600 18 5 16 5z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/captcha.css" />
  </head>
  <body>
    <main class="page">
      <!-- The front door. Two buttons, and nowhere to type. -->
      <section id="home" class="card home">
        <svg class="logo" viewBox="0 0 64 64" width="60" height="60" aria-hidden="true">
          <circle cx="24" cy="42" r="16" fill="#202124" />
          <circle cx="18" cy="36" r="2.200" fill="#fff" /><circle cx="25" cy="33" r="2.200" fill="#fff" /><circle cx="24" cy="41" r="2.200" fill="#fff" />
          <path d="M45 8c-3 0-4.600 2.400-4.600 5.200 0 2.300 1.200 3.600 1.200 5.500 0 2.400-3.600 6.100-3.600 12.500 0 5.500 2.700 11.500 7 11.500s7-6 7-11.500c0-6.400-3.600-10.100-3.600-12.500 0-1.900 1.200-3.200 1.200-5.500C49.600 10.400 48 8 45 8z" fill="#fff" stroke="#202124" stroke-width="2" />
          <rect x="41" y="16.500" width="8" height="2.600" fill="#e0352b" />
        </svg>
        <h1>BowlID</h1>
        <p class="tag">Your identity is in your swing.</p>

        <button id="create" class="big solid" type="button">Create your bowling identity<kbd class="remote">2</kbd></button>
        <button id="login" class="big" type="button">Log in with your swing<kbd class="remote">A</kbd></button>

        <div id="widget" class="widget" data-state="idle">
          <span class="check" aria-hidden="true"><span class="box"></span></span>
          <span id="widget-label" class="label">I am me</span>
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="34" height="34">
              <path d="M16 3c-2.200 0-3.400 1.800-3.400 3.900 0 1.700.9 2.700.9 4.100 0 1.800-2.700 4.600-2.700 9.400C10.800 24.500 12.800 29 16 29s5.200-4.500 5.200-8.600c0-4.800-2.700-7.600-2.700-9.400 0-1.400.9-2.400.9-4.100C19.400 4.800 18.200 3 16 3z" fill="#4a8ff0" />
              <rect x="12.600" y="9.300" width="6.800" height="1.800" fill="#fff" />
            </svg>
            <b>BowlID</b>
            <small>Privacy · Terms</small>
          </div>
        </div>
        <p id="widget-note" class="widget-note" aria-live="polite"></p>

        <p class="rule">No usernames. No passwords. Just bowling.</p>
        <p class="fine" id="home-links"></p>
      </section>

      <!-- The account that the swing opened. -->
      <section id="inside" class="card inside" hidden></section>

      <p id="ledger" class="ledger"></p>
    </main>

    <!-- The challenge. Laid out like the ones you know, except for what is inside it. -->
    <div id="veil" class="veil" hidden>
      <div class="challenge" role="dialog" aria-label="BowlID challenge">
        <header class="ask">
          <div>
            <span id="ask-top"></span>
            <strong id="ask-main"></strong>
            <span id="ask-sub"></span>
          </div>
          <div id="rack" class="rack" aria-hidden="true"></div>
        </header>
        <div class="stage">
          <div id="lane" class="lane" aria-label="Bowling lane"></div>
          <div class="hud" aria-hidden="true">
            <div id="power" class="power" hidden><span>Power</span><i><b></b></i></div>
            <div id="slots" class="slots" hidden></div>
            <div id="banner" class="banner" hidden></div>
            <p id="hint" class="hint"></p>
          </div>
          <div id="sim" class="sim" hidden></div>
          <div id="report" class="report" hidden></div>
          <div id="info" class="info" hidden></div>
        </div>
        <footer class="tools">
          <div class="icons">
            <button id="reload" type="button" title="Get a new challenge" aria-label="Get a new challenge">
              <svg viewBox="0 0 24 24" width="26" height="26"><path d="M17.650 6.350A8 8 0 1 0 19.730 14h-2.080A6 6 0 1 1 16.240 7.760L13 11h7V4z" fill="currentColor"/></svg>
            </button>
            <button id="sound" type="button" title="Sound on or off" aria-label="Sound on or off">
              <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h3v-8H5v-1a7 7 0 0 1 14 0v1h-3v8h3a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z" fill="currentColor"/></svg>
            </button>
            <button id="help" type="button" title="How to bowl" aria-label="How to bowl">
              <svg viewBox="0 0 24 24" width="26" height="26"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z" fill="currentColor"/></svg>
            </button>
          </div>
          <p id="status" class="status" aria-live="assertive"></p>
          <button id="cancel" class="skip" type="button">Cancel</button>
          <button id="verify" class="verify" type="button">Verify</button>
        </footer>
      </div>
    </div>

    <button id="mode" class="mode" type="button" title="Switch between the Wii Remote and the pointer"></button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
